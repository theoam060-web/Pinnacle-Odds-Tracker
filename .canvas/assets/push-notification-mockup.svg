<svg width="440" height="760" viewBox="0 0 440 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phoneBg" x1="0" y1="0" x2="440" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0d18"/>
      <stop offset="100%" stop-color="#06060e"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#12121e"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181827"/>
      <stop offset="100%" stop-color="#101020"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d2233"/>
      <stop offset="100%" stop-color="#061520"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="phoneClip">
      <rect x="0" y="0" width="440" height="760" rx="44"/>
    </clipPath>
  </defs>

  <!-- Phone body -->
  <rect width="440" height="760" rx="44" fill="url(#phoneBg)"/>

  <!-- Status bar area -->
  <rect x="0" y="0" width="440" height="54" fill="rgba(0,0,0,0.3)"/>

  <!-- Notch -->
  <rect x="155" y="0" width="130" height="36" rx="18" fill="#000"/>

  <!-- Status bar: time -->
  <text x="36" y="35" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="15" font-weight="600" fill="white">11:42</text>

  <!-- Status bar: signal + battery icons (simplified) -->
  <rect x="340" y="22" width="24" height="11" rx="3" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <rect x="365" y="25" width="2" height="5" rx="1" fill="rgba(255,255,255,0.6)"/>
  <rect x="341" y="23" width="18" height="9" rx="2" fill="rgba(255,255,255,0.6)"/>
  <rect x="322" y="22" width="14" height="11" rx="2" fill="rgba(255,255,255,0.5)"/>
  <rect x="304" y="24" width="10" height="7" rx="1.5" fill="rgba(255,255,255,0.4)"/>

  <!-- Lock screen clock -->
  <text x="220" y="125" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="62" font-weight="200" fill="white" text-anchor="middle" letter-spacing="-2">11:42</text>
  <text x="220" y="152" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.65)" text-anchor="middle" letter-spacing="0.5">Monday, 7 April</text>

  <!-- Notification cards container header -->
  <text x="220" y="206" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="0.8">NOTIFICATIONS</text>

  <!-- === Notification Card 1 (prominent) === -->
  <rect x="20" y="218" width="400" height="96" rx="16" fill="url(#cardGrad1)" filter="url(#cardShadow)"/>
  <!-- left cyan accent bar -->
  <rect x="20" y="218" width="4" height="96" rx="2" fill="#00e5ff" opacity="0.9"/>

  <!-- App icon -->
  <rect x="36" y="234" width="40" height="40" rx="10" fill="url(#iconGrad)"/>
  <!-- Activity wave in icon -->
  <polyline points="39,255 43,255 46,249 49,262 52,250 55,257 58,252 61,257 64,254 68,254" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- App name + time -->
  <text x="84" y="247" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="0.3">SharpTracker</text>
  <text x="370" y="247" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)" text-anchor="end">just now</text>

  <!-- Notification title with lightning -->
  <text x="84" y="265" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="15" font-weight="700" fill="white">⚡ Sharp Drop — Arsenal vs Chelsea</text>

  <!-- Body text -->
  <text x="84" y="285" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">Moneyline · Pinnacle</text>
  <!-- Drop value highlight -->
  <rect x="204" y="274" width="130" height="18" rx="4" fill="rgba(255,70,70,0.15)"/>
  <text x="208" y="287" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#ff6b6b">▼ 2.18 → 2.11  −3.2%</text>

  <!-- Subtle divider line glow -->
  <line x1="30" y1="303" x2="410" y2="303" stroke="rgba(0,229,255,0.08)" stroke-width="1"/>

  <!-- Action buttons -->
  <text x="84" y="316" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#00e5ff">View Drop</text>
  <text x="180" y="316" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.35)">Dismiss</text>

  <!-- === Notification Card 2 === -->
  <rect x="20" y="326" width="400" height="80" rx="16" fill="url(#cardGrad2)" filter="url(#cardShadow)" opacity="0.95"/>
  <rect x="20" y="326" width="4" height="80" rx="2" fill="#00e5ff" opacity="0.6"/>

  <rect x="36" y="340" width="34" height="34" rx="9" fill="url(#iconGrad)" opacity="0.85"/>
  <polyline points="39,358 43,358 46,353 49,364 52,354 55,360 58,355 61,360 64,357 68,357" stroke="#00e5ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <text x="78" y="353" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="11.5" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="0.3">SharpTracker</text>
  <text x="370" y="353" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="end">2 min ago</text>

  <text x="78" y="371" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="14" font-weight="700" fill="rgba(255,255,255,0.9)">⚡ Sharp Drop — Lakers vs Bulls</text>
  <text x="78" y="390" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">Totals · FanDuel</text>
  <rect x="174" y="379" width="122" height="17" rx="4" fill="rgba(255,70,70,0.1)"/>
  <text x="178" y="392" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#ff8080">▼ 211 → 209  −1.0%</text>

  <!-- === Notification Card 3 === -->
  <rect x="20" y="418" width="400" height="74" rx="16" fill="rgba(16,16,28,0.85)" filter="url(#cardShadow)" opacity="0.85"/>
  <rect x="20" y="418" width="4" height="74" rx="2" fill="#00e5ff" opacity="0.4"/>

  <rect x="36" y="430" width="30" height="30" rx="8" fill="rgba(0,20,33,0.7)" opacity="0.8"/>
  <polyline points="39,446 43,446 46,441 49,452 52,443 55,448 57,444 60,448 63,445 67,445" stroke="#00e5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>

  <text x="74" y="444" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.35)" letter-spacing="0.3">SharpTracker</text>
  <text x="370" y="444" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.25)" text-anchor="end">4 min ago</text>

  <text x="74" y="461" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="rgba(255,255,255,0.75)">⚡ Sharp Drop — Djokovic vs Alcaraz</text>
  <text x="74" y="479" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="12.5" fill="rgba(255,255,255,0.5)">Moneyline · Bet365  <tspan fill="rgba(255,130,130,0.75)" font-weight="600">▼ 1.65 → 1.54  −6.7%</tspan></text>

  <!-- Older notifications indicator -->
  <text x="220" y="514" font-family="SF Pro Display, -apple-system, Helvetica, sans-serif" font-size="12" fill="rgba(255,255,255,0.2)" text-anchor="middle">2 more notifications</text>

  <!-- Home indicator -->
  <rect x="165" y="728" width="110" height="5" rx="3" fill="rgba(255,255,255,0.3)"/>

  <!-- Subtle bottom vignette -->
  <rect x="0" y="640" width="440" height="120" fill="url(#phoneBg)" opacity="0.7"/>
  <rect x="0" y="0" width="440" height="760" rx="44" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
</svg>
