<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="iconGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cccc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- No background — transparent -->

  <!-- Activity / pulse icon -->
  <polyline
    points="27,60 40.5,60 45,46.5 54,79.5 63,33 67.5,46.5 81,46.5"
    fill="none"
    stroke="url(#iconGlow2)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow2)"
  />

  <!-- "Sharp" in white -->
  <text
    x="104"
    y="72"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="38"
    letter-spacing="-1"
    fill="#ffffff"
  >Sharp</text>

  <!-- "Tracker" in cyan -->
  <text
    x="245"
    y="72"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="38"
    letter-spacing="-1"
    fill="#00ffff"
    filter="url(#glow2)"
  >Tracker</text>
</svg>
