<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="112" fill="#0a0a10"/>
  <rect width="512" height="512" rx="112" fill="url(#grad)" opacity="0.15"/>
  <!-- Activity wave / sharp drop signal -->
  <polyline
    points="60,256 130,256 175,180 220,340 265,190 310,290 355,200 400,290 440,240 512,240"
    stroke="#00e5ff"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.95"
  />
  <!-- Drop arrow at the peak -->
  <line x1="265" y1="190" x2="265" y2="330" stroke="#00e5ff" stroke-width="22" stroke-linecap="round" opacity="0.4"/>
  <polyline points="235,300 265,340 295,300" stroke="#00e5ff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0052cc"/>
    </linearGradient>
  </defs>
</svg>
