kind = "web"
previewPath = "/"
title = "Odds Dropper"
version = "1.0.0"
id = "artifacts/odds-dropper"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21569

[services.development]
run = "pnpm --filter @workspace/odds-dropper run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/odds-dropper", "run", "build" ]
publicDir = "artifacts/odds-dropper/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21569"
BASE_PATH = "/"
